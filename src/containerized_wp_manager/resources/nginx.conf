server {
    listen          443;
    listen          [::]:443;
    http2           on;
    #ssl_certificate     /etc/ssl/certbot/<CWPM_ID>/live/<CWPM_DOMAIN>/fullchain.pem;
    #ssl_certificate_key /etc/ssl/certbot/<CWPM_ID>/live/<CWPM_DOMAIN>/privkey.pem;

    # HSTS (2 years)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    server_name  <CWPM_DOMAIN>;

    root /var/www/html/<CWPM_ID>;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location ~ \.php$ {
        root           /var/www/html;
        # All PHP-FPM containers start with the cwpm- prefix
        fastcgi_pass   cwpm-<CWPM_ID>:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  /var/www/html/$fastcgi_script_name;
        include        fastcgi_params;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny  all;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location /.well-known {
        root /var/www/html/<CWPM_ID>;
        try_files $uri $uri/ =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# intermediate configuration
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# see also ssl_session_ticket_key alternative to stateful session cache
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
