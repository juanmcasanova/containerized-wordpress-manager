server {
    listen          443 ssl;
    listen          [::]:443 ssl;
    http2           on;
    ssl_certificate     /etc/ssl/certbot/<CWPM_ID>/live/<CWPM_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/ssl/certbot/<CWPM_ID>/live/<CWPM_DOMAIN>/privkey.pem;

    # HSTS (2 years)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    server_name  <CWPM_DOMAIN>;

    return 308 https://<CWPM_MAIN_DOMAIN>$request_uri;
}
